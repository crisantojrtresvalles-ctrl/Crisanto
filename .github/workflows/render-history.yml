name: Render History Video

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Prepare Remotion browser
        run: npx remotion browser ensure

      - name: Render HistoryPrototype
        run: npx remotion render src/index.ts HistoryPrototype out/history-prototype.mp4 --codec=h264

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: history-prototype-video
          path: out/history-prototype.mp4
          if-no-files-found: error
          retention-days: 7
