
name: Render History Video

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render src/index.ts Scene out/history-video.mp4 --gl=swangle
        
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: history-video
          path: out/history-video.mp4
          retention-days: 7
