name: Render History Video

on:
  workflow_dispatch:
  push:
    branches:
      - history-engine

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install narration voice + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Generate audio (music, sfx, narration)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: node scripts/generate-audio.mjs

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Type check
        run: npx tsc

      - name: Render video
        run: |
          mkdir -p out
          npx remotion render src/index.ts History out/history-pirates.mp4 --gl=swangle

      - name: Verify video (720x1280, 30fps, 60s, audio present)
        run: |
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -show_entries format=duration -of default=nw=1 out/history-pirates.mp4 | tee out/probe.txt
          grep -q "width=720" out/probe.txt
          grep -q "height=1280" out/probe.txt
          grep -q "r_frame_rate=30/1" out/probe.txt
          grep -q "codec_type=audio" out/probe.txt

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: history-pirates
          path: out/history-pirates.mp4
          retention-days: 14
